[package]
name = "interpreter"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []
arbitrary = ["dep:arbitrary"]

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
borsh = { version = "1.8.1", features = ["derive"] }
solana-program = "4.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
