[package]
name = "test-harness"
version = "0.1.0"
edition = "2024"
default-run = "runtime-fuzz"

[[bin]]
name = "runtime-fuzz"
path = "fuzz/runtime.rs"
test = false
doc = false

[dependencies]
arbitrary = { version = "=1.4.2", features = ["derive"] }
bincode = "1.3.3"
borsh = "1.8.1"
interpreter = { path = "../interpreter", features = ["arbitrary", "no-entrypoint"] }
libloading = "0.9.0"
prost = "0.14.4"
protosol = "=17.0.0"
solana-clock = { version = "=4.0.0", features = ["serde"] }
solana-epoch-schedule = { version = "=3.4.0", features = ["serde"] }
solana-rent = { version = "=4.5.0", features = ["serde"] }
solana-sdk-ids = "=3.1.0"
ziggy = { version = "=1.7.1", default-features = false }
# Agave master's instruction conformance harness, as of 2026-10-01.
solana-svm-conformance = { git = "https://github.com/anza-xyz/agave", rev = "7953e4d6984eeb9a4caf9f8b20b6dadd6cad4f8b", default-features = false, features = ["ffi"] }

[dev-dependencies]
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
