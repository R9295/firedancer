[package]
name = "test-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
protosol = "=15.0.0"
# solfuzz-agave has no master branch. This pins its default branch,
# agave-v4.3.0-beta.0, as observed on 2026-09-08.
solfuzz-agave = { git = "https://github.com/firedancer-io/solfuzz-agave", rev = "267f0c42195795c5d5ab4be54b70b9ad7ca18baf" }

[dev-dependencies]
bincode = "1.3.3"
borsh = "1.8.1"
interpreter = { path = "../interpreter", features = ["no-entrypoint"] }
solana-clock = "=3.2.0"
solana-rent = { version = "=4.4.0", features = ["serde"] }
solana-sdk-ids = "=3.1.0"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }

# Required by solfuzz-agave: Cargo does not inherit dependency patches.
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "2c0ffd79c1b2e1f5220ee5f7c71af5080a5309e3" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "2c0ffd79c1b2e1f5220ee5f7c71af5080a5309e3" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
